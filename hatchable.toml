[project]
name = "MuleShield"

[[config]]
name = "risk_hold_threshold"
type = "number"
label = "Risk hold threshold"
default = 0.90
description = "Score at or above this value routes the prototype decision to hold."

[[config]]
name = "risk_review_threshold"
type = "number"
label = "Risk review threshold"
default = 0.75
description = "Score at or above this value routes the prototype decision to review."

[[config]]
name = "risk_verify_threshold"
type = "number"
label = "Risk verification threshold"
default = 0.55
description = "Score at or above this value routes the prototype decision to verification."